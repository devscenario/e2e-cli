name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: ['', '0.2.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
      - id: setup
        uses: ./
        with:
          version: ${{ matrix.version }}
      - name: devscenario is on PATH
        shell: bash
        run: |
          echo "installed ${{ steps.setup.outputs.version }} at ${{ steps.setup.outputs.path }}"
          devscenario --help | head -3
